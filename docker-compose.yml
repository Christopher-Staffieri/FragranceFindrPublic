
services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/code/src/
      - ./frontend/public:/code/public/

  db:
    image: postgres:18.1
    container_name: fragrancefindrdb
    environment:
      POSTGRES_DB: fragrancefindrdevdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fragrancefindrdbpass
    volumes:
      - ./data/database:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fragrancefindrdevdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: backend
    build:
      context: ./backend/
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:fragrancefindrdbpass@db:5432/fragrancefindrdevdb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/backend:/code/backend/
      - ../../allauth:/code/allauth
    ports:
      - 8000:8000

  proxy:
    image: traefik:v3.0
    container_name: proxy
    ports:
      - 10000:10000
    volumes:
      - ./traefik.toml:/etc/traefik/traefik.toml

  mail:
    container_name: mail
    image: schickling/mailcatcher
    ports:
      - 1080:1080
      - 1025:1025

  redis:
    image: redis:latest
    container_name: fragrancefindr-redis
    ports:
      - 6379:6379
    # networks:
    #   - redis-django

  asgiserver:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    container_name: asgiserver
    command: daphne -b 0.0.0.0 -p 9000 backend.asgi:application
    volumes:
      - .:/app/
    ports:
      - "9000:9000"
    depends_on:
      - redis

  
volumes:
  postgres_data: 

    # networks: 
    #   - redis-django
  # networks:
  #   redis-django:
  #     driver: bridge
    
